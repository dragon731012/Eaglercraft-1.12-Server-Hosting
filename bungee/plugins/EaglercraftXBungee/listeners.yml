listener_01:
  address: 0.0.0.0:5000
  address_v6: null
  max_players: 1000
  tab_list: SERVER
  default_server: lobby
  force_default_server: true
  forward_ip: false
  forward_ip_header: X-Real-IP
  redirect_legacy_clients_to: null
  server_icon: VSTD_logo.jpg
  allow_voice: true
  server_name: "&bV•S•T•D"
  
  server_motd:
    - "&b&lV•S•T•D&r &7• &fThe Multiverse Awaits..."
    - "&7&o Oneblock•Survival•PitPvP•Skywars•Bedwars & more!"

  allow_motd: true
  motd_enabled: true
  motd_override: true  
  motd_passthrough: false
  ping_passthrough: false
  allow_query: true

  request_motd_cache:
    cache_ttl: 7200
    online_server_list_animation: true
    online_server_list_results: true
    online_server_list_trending: true
    online_server_list_portfolios: false

  http_server:
    enabled: true
    root: '../../web'
    page_404_not_found: 'default'
    page_index_name:
      - 'index.html'
      - 'index.htm'

  ratelimit:
    ip:
      enable: false
      period: 90
      limit: 60
      limit_lockout: 80
      lockout_duration: 1200
      exceptions:
        - '127.*'
        - '0:0:0:0:0:0:0:1'

    login:
      enable: true
      period: 100
      limit: 10
      limit_lockout: 15
      lockout_duration: 100
      exceptions:
        - '127.*'
        - '0:0:0:0:0:0:0:1'

    motd:
      enable: true
      period: 30
      limit: 5
      limit_lockout: 15
      lockout_duration: 300
      exceptions:
        - '127.*'
        - '0:0:0:0:0:0:0:1'

    query:
      enable: false
      period: 30
      limit: 15
      limit_lockout: 25
      lockout_duration: 900
      exceptions:
        - '127.*'
        - '0:0:0:0:0:0:0:1'
