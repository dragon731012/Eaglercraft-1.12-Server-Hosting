  Help:
    - '&2&l&nCrazy Enchantments'
    - '&b/ce - &9Открывает меню.'
    - '&b/tinker - &9Открывает меню Tinkerer.'
    - '&b/blacksmith - &9Открывает меню BlackSmith.'
    - '&b/gkitz [kit] [player] - &9Откройте меню gkit или получите файл gkit.'
    - '&b/gkitz reset <kit> [player] - &9Сбросить время восстановления набора игрока.'
    - '&b/ce help - &9Показывает все команды безумного зачарования.'
    - '&b/ce debug - &9Выполняет небольшую отладку некоторых ошибок.'
    - '&b/ce info [enchantment] - &9Показывает информацию обо всех чарах.'
    - '&b/ce reload - &9Перезагружает все файлы конфигурации.'
    - '&b/ce remove <enchantment> - &9Снимает чары с предмета в вашей руке.'
    - '&b/ce add <enchantment> [level] - &9Добавляет чары к предмету в вашей руке.'
    - '&b/ce scroll <black/white/transmog> [amount] [player] - &9Дает игроку свиток.'
    - '&b/ce crystal [amount] [player] - &9Дает игроку предмет «Кристалл защиты».'
    - '&b/ce scrambler [amount] [player] - &9Дает игроку предмет «Скремблер».'
    - '&b/ce dust <success/destroy/mystery> [amount] [player] [percent] - &9Дать игроку предмет-пыль.'
    - '&b/ce book <enchantment> [level/min-max] [amount] [player] - &9Дает игроку Книгу чар.'
    - '&b/ce lostbook <category> [amount] [player] - &9Дает игроку потерянный книжный предмет.'
    - '&b/ce spawn <enchantment/category> [(level:#/min-max)/world:<world>/x:#/y:#/z:#] - &9Бросает книгу зачарований в указанную точку.'