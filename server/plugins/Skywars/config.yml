sqldatabase:
  enabled: false
  hostname: localhost
  port: 3306
  database: database
  username: username
  password: password
  # Disable SSL/certificate checks if your MySQL host does not provide TLS certificates.
  ssl: false
  verifyCertificate: false
  publicKeyRetrieval: false
  connectTimeoutMs: 10000
  socketTimeoutMs: 30000
  serverTimezone: UTC
  useUnicode: true
  characterEncoding: utf8
migration:
  ultimateskywars:
    mongodb:
      host: localhost
      port: 27017
      database: database
      # Optional: database used for MongoDB authentication (authSource). Defaults to 'database' when empty.
      authDatabase: admin
      # auto, scram-sha-1, or scram-sha-256
      authMechanism: auto
      # ESSENTIALSX (via Vault), BUILTIN (store in sw_player.economy), or SKIP.
      economyImportMode: BUILTIN
      # Optional ID mappings for importing USW-owned kits/perks into SWR permissions.
      # Example: kits: { "1": "scout" } -> grants sw.kit.scout when USW kit id 1 is owned.
      # Example: perks: { "3": "bulldozer" } -> grants sw.perk.bulldozer.<level> from USW perksData.
      # If left empty, migrateusw auto-detects mappings from plugins/Skywars/UltraSkyWars/kits.yml and perks.yml.
      mappings:
        kits: {}
        perks: {}
      # Print resolved migration Mongo settings and full exception chain.
      debug: false
      username: ''
      password: ''
      collection: players
