game:
  win:
    clearInventory: true
    enableFlight: false
  kickOnWorldTeleport: true
  enableQuickDeath: true
  quickDeathY: -10
  enablePVPTimer: true
  PVPTimerTime: 10 # this is the time in seconds
  enableWinMessage: true
  enableLookDirection: true
  worldBorder:
