# MythicSkywars Perks Configuration
# Perks are passive abilities that activate during gameplay.
# Players can unlock perks via the Soul Well or purchase them with coins.
# Each perk can have multiple upgrade levels.
#
# Perk types:
#   DAMAGE_REDUCTION - Reduces incoming damage by percent (fall, fire, projectile)
#   KILL_EFFECT      - Grants a potion effect on kill (regen, strength, absorption)
#   GAME_START       - Grants a potion effect when the game starts (speed, resistance)
#   ARROW_RECOVERY   - Chance to recover arrows on hit
#   BLAZING_ARROWS   - Chance to set arrows on fire
#   NOURISHMENT      - Restores hunger on kill
#   ENDER_MASTERY    - Reduces ender pearl damage
#   MINING_EXPERTISE - Chance to get extra ores
#   KNOWLEDGE        - Grants XP levels on kill
#   ANNOYOMITE       - Chance to spawn silverfish on arrow hit

